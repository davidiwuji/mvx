<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="50%" stop-color="#0E111A" />
      <stop offset="100%" stop-color="#07090E" />
    </linearGradient>
    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#FFA800" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="750" fill="url(#bgGrad)" />
  <rect width="500" height="750" fill="url(#glow)" />

  <!-- Outer Border -->
  <rect x="2" y="2" width="496" height="746" rx="24" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Center Cinema Play Mark -->
  <g transform="translate(200, 275)">
    <circle cx="50" cy="50" r="46" fill="rgba(255, 107, 0, 0.12)" stroke="rgba(255, 107, 0, 0.3)" stroke-width="2" />
    <polygon points="42,32 68,50 42,68" fill="url(#neonOrange)" />
  </g>

  <!-- Text Badge -->
  <g transform="translate(250, 420)">
    <text text-anchor="middle" fill="#9CA3AF" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="2">
      MVX CINEMA
    </text>
    <text text-anchor="middle" y="28" fill="#4B5563" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">
      Preview Not Available
    </text>
  </g>
</svg>
