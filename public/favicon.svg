<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="mvx-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="50%" stop-color="#FF8A00" />
      <stop offset="100%" stop-color="#FF3D00" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background rounded box -->
  <rect width="100" height="100" rx="24" fill="#0D0F17" />
  <rect x="2" y="2" width="96" height="96" rx="22" stroke="url(#mvx-grad)" stroke-width="2" stroke-opacity="0.4" />
  <!-- Stylized Cinema Play Mark -->
  <path d="M38 30L72 50L38 70V30Z" fill="url(#mvx-grad)" filter="url(#glow)" />
  <circle cx="70" cy="30" r="4" fill="#FF8A00" />
</svg>
